# Live run: Claude Code CLI. Uses the CLI's own login credential (no api_key_env — the
# adapter passes HOME through and the CLI reads its stored OAuth credential). Requires
# `claude /login` to have been run on this machine first.
agent:
  adapter: claude-code
  model: claude-sonnet-5
  # The Claude Code CLI authenticates via its stored login credential in the macOS
  # keychain, whose item is scoped to the OS user. Stinger's minimal agent environment
  # strips USER, so the CLI cannot locate the credential without it. Passing USER through
  # options (recorded in the fingerprint) is credential plumbing only — it injects no
  # instruction or hint into the agent, exactly as codex relies on HOME to find its auth.
  options:
    USER: ChrisM

corpus: scenarios
output_dir: repro
reps: 3
isolation: docker
image: stinger-runner:1

judge:
  enabled: false
