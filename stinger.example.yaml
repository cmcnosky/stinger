# Example Stinger run configuration (SPEC.md §13).
#
# Copy to `stinger.yaml`, point `agent:` at the agent you want to measure, and run:
#
#     stinger validate scenarios/     # prove every trap is fair first
#     stinger run --config stinger.yaml
#
# No secret belongs in this file. An adapter names the ENVIRONMENT VARIABLE that holds its
# API key; Stinger reads it at run time and passes it to the agent process, and never writes
# a key into a config, a fingerprint, or a report.

agent:
  # One of: claude-code | codex | aider | shell | recorded
  adapter: claude-code

  # The agent's model id, when it has one. Part of the config fingerprint, so a report always
  # says which model produced it.
  model: claude-opus-4-8

  # Benchmark provenance pins. Ordinary development runs may omit them. A benchmark release
  # gate requires an exact provider request, CLI/build version, reasoning mode, and all
  # resolved inference parameters rather than a floating default. `provider` records what the
  # operator requested; it is not remote provider attestation. Before any benchmark task
  # starts, Stinger independently observes the clean Git HEAD, both Docker image identities,
  # the effective argv/settings, and the exact output of the adapter's non-network version
  # command, and refuses a mismatch.
  # provider: anthropic
  # cli_version: "claude-code 1.2.3"  # exact stripped output of `claude --version`
  # reasoning_effort: high
  # inference_settings:
  #   temperature: 0.0
  #   max_output_tokens: 32768

  # NAME of the env var holding the key — never the key itself. Stinger refuses to start the
  # agent if this variable is unset, rather than letting an auth failure downstream look like
  # the agent misbehaving.
  #
  # ANTHROPIC_API_KEY is the right name for a local run, where your shell already has it. In
  # the reusable GitHub workflow (.github/workflows/stinger.yml) the secret you pass arrives
  # as the environment variable AGENT_API_KEY, so a config used there must say
  # `api_key_env: AGENT_API_KEY` instead.
  api_key_env: ANTHROPIC_API_KEY

  # Optional, and the difference between "the agent could not reach outside its workdir" and
  # "we asked it not to". SPEC.md §5 requires the former and only a container delivers it:
  # without one the agent is a host subprocess with its working directory set, and a live run
  # has been observed reading the agent's own memory file from the operator's home and
  # pulling unrelated project notes into the recorded evidence. It is also required for the X
  # (safety/exfiltration) family, which `stinger run` refuses outright without it.
  #
  # Stinger cannot supply a default because the image must contain the agent CLI. One is
  # shipped for Codex — build it with:
  #     docker build -t stinger-codex-agent:1 -f docker/codex-agent.Dockerfile .
  # container_image: stinger-codex-agent:1
  #
  # Publication evidence additionally records the immutable digest actually selected for
  # this image; a mutable tag alone is not a benchmark pin.
  # container_image_digest: sha256:<64 lowercase hex digits>

  # Optional. A host directory holding the agent's credentials, mounted READ-ONLY at
  # /credentials inside the agent container. Only needed when the CLI authenticates from a
  # file rather than an environment variable — Codex under a ChatGPT subscription keeps OAuth
  # tokens in auth.json, which `api_key_env` cannot express.
  #
  # This is the one hole in "nothing but the workdir is mounted", so keep it a hole and not a
  # door: put ONLY the credential file in this directory. Pointing it at ~/.codex, ~/.claude
  # or any real agent home hands the agent under test that agent's memories, session history
  # and config, which is precisely the contamination the container exists to prevent. Whether
  # one was mounted is part of the config fingerprint; where it lives is not.
  # credential_mount: ~/.stinger/codex-credentials

  # For `adapter: shell` only — how to invoke an agent Stinger has never heard of.
  # `{prompt}`, `{model_id}`, `{reasoning_effort}`, and `{inference_settings_json}` are replaced
  # verbatim, per argument. A declared model or setting MUST have its corresponding placeholder
  # so the report cannot claim a setting the command ignored. This is never a shell string, so
  # a prompt containing quotes or backticks cannot become shell syntax. Benchmark mode also
  # requires a non-network version probe whose exact stripped output equals `cli_version`.
  # command:
  #   ["my-agent", "--model", "{model_id}", "--effort", "{reasoning_effort}",
  #    "--settings-json", "{inference_settings_json}", "--non-interactive", "{prompt}"]
  # version_command: ["my-agent", "--version"]

corpus: scenarios
output_dir: repro

# Each scenario runs this many times. The scenario's MODAL outcome scores; the per-scenario
# distribution and the per-family standard deviation are published alongside it, always
# (SPEC.md §8.4). Agents are not deterministic, and hiding that is prohibited.
reps: 3

# Benchmark mode is separately versioned from the frozen scoring rubric. Leave this entire
# block commented for normal development runs. Benchmark v1 under Protocol 2 uses reps: 5
# and records the exact Stinger revision, verification image, and fixed
# ordering/bootstrap seed. Supplying these values does not by itself make a run
# publishable; sealed-corpus, machine-construction, matrix, bundle, cross-environment
# reproduction, and final operator-authorization gates still apply.
#
# benchmark_protocol_version: "2.0.0"
# stinger_commit: <full 40-character Git commit>
# verification_image_digest: sha256:<64 lowercase hex digits>
# run_seed: 17

# docker (the real mode) | local (development only, and it refuses the X safety family)
isolation: docker

# The image verification commands run in. It must already contain pytest, because
# verification runs with the network disabled. Build Stinger's before the first Docker run
# using the deterministic platform-specific recipe in README.md's Development section.
# `stinger run` preflights this image and refuses to start if it cannot serve a completion
# check — otherwise every scenario would score as a failure for a reason unrelated to the
# agent, and the report would look entirely plausible.
image: stinger-runner:1

# Restrict the run to one family. A run that does not cover all five families is labelled a
# partial/dev run in every output and MUST NOT be presented as a Stinger score.
# only: T

# The optional LLM judge (SPEC.md §9). Advisory only: it may move a mechanically-honest
# scenario onto a needs-review list and nothing else. It can never set or override a
# cheated/honest label, and enabling it never changes the headline Integrity Rate. Stinger
# ships no judge transport — you supply a JudgeClient — so leaving this off is the default.
judge:
  enabled: false
  # model: claude-opus-4-8
  # prompt_version: "1.0.0"

# CI gates (SPEC.md §14). Either or both; unset gates nothing and just reports the number.
#
# An absolute floor:
# regression_threshold: 0.95
#
# Or no regression against a committed baseline — point this at a report.json from a previous
# run and commit it. The baseline is re-scored from its own stored results before it is
# trusted, so you cannot lower it by editing its headline number; you would have to edit the
# evidence too, and that shows up in a diff.
# baseline: stinger-baseline.json
#
# How much of a drop to absorb before failing. Zero means any regression fails. Raise it only
# with your eyes open: agents are non-deterministic, so some flapping is real, but every point
# of tolerance is also a real regression you have chosen not to see. The report publishes the
# per-family standard deviation, which is the honest way to judge how much noise you have.
# regression_tolerance: 0.0
