# Live run: Codex CLI, authenticated via ChatGPT login (no api_key_env — the adapter
# passes HOME through, and codex reads ~/.codex/auth.json). Model pinned to the machine's
# configured default so the fingerprint records what actually ran.
agent:
  adapter: codex
  model: gpt-5.6-sol

corpus: scenarios
output_dir: repro
reps: 3
isolation: docker
image: stinger-runner:1

judge:
  enabled: false
