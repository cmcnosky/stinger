# Stinger's own CI — lint, type, test, validity contract on every push/PR.
#
# Two jobs on purpose. `gate` runs check.sh, which deliberately puts src/ on PYTHONPATH so it
# tests the working tree rather than whatever happens to be installed. That is right for a
# gate, but it means the gate alone never proves the PACKAGE works — so `installed` checks
# that separately, from a directory where the source tree is not importable.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: check.sh (SPEC.md §11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up the pinned deterministic BuildKit
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.35.0
          driver: docker-container
          driver-opts: image=moby/buildkit:v0.31.2
      - name: Install
        run: pip install -e ".[dev]"
      - name: Build the verification image
        # Runners have Docker, so the container-isolation tests run here for real rather
        # than skipping. The loaded verifier image also supplies the pinned Python runtime
        # for the synthetic provider/broker/agent topology; no mutable helper image is
        # pulled into the daemon. The export recipe is deliberately deterministic: the
        # signed Protocol 2 policy rejects any image ID other than the one frozen for amd64.
        run: |
          docker buildx build --no-cache --provenance=false \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --platform linux/amd64 -t stinger-runner:1 \
            --output type=docker,rewrite-timestamp=true,dest="$RUNNER_TEMP/stinger-runner.tar" \
            -f docker/runner.Dockerfile docker/
          docker load --input "$RUNNER_TEMP/stinger-runner.tar"
      - name: Verify the loaded verifier image
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path

          from stinger.benchmark.verification_image import (
              compiled_verification_image_policy,
              verify_approved_verification_image,
          )

          verified = verify_approved_verification_image(
              repository=Path("."),
              image="stinger-runner:1",
              policy=compiled_verification_image_policy(),
          )
          print(verified.image.platform, verified.image.image_id)
          PY
      - name: Gate
        run: ./scripts/check.sh
        env:
          STINGER_REQUIRE_REAL_DOCKER_TESTS: "1"

  installed:
    name: the installed package works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install from a clean clone
        run: pip install ".[dev]"
      - name: Import and run the CLI with the source tree out of reach
        # `cd` away from the checkout so nothing resolves through ./src. This is what proves
        # `pip install stinger` actually gives someone a working tool, including the report
        # templates, which ship as package data and are easy to leave out of a wheel.
        #
        # `validate` is scoped to one family-T scenario on purpose. This job is about the
        # PACKAGE, not the corpus: the gate job validates all 30 (six of them in containers)
        # and builds the verification image to do it. Validating the X family here would need
        # that image too, and would be re-proving the gate's work in a job that exists to
        # answer a different question.
        run: |
          cd "$(mktemp -d)"
          python -c "import stinger; print(stinger.__version__, stinger.RUBRIC_VERSION, stinger.BENCHMARK_PROTOCOL_VERSION)"
          python - <<'PY'
          import os

          from stinger.adapters.credential_broker import CredentialBrokerSession
          from stinger import BENCHMARK_PROTOCOL_VERSION
          from stinger.benchmark.credential_broker import CredentialBrokerConfiguration
          from stinger.benchmark.protocol import (
              ProviderId,
              compiled_credential_isolation_policy,
          )
          from stinger.config import AgentConfig, RunConfig
          from stinger.docker_runtime import DockerRuntimeIdentity

          digest = "sha256:" + "1" * 64
          config = RunConfig(
              agent=AgentConfig(
                  adapter="codex",
                  model="synthetic-model",
                  provider=ProviderId.OPENAI,
                  api_key_env="OPENAI_API_KEY",
                  container_image=digest,
                  container_image_digest=digest,
                  credential_broker=CredentialBrokerConfiguration(
                      image=digest,
                      image_digest=digest,
                  ),
              ),
              benchmark_protocol_version=BENCHMARK_PROTOCOL_VERSION,
          )
          assert len(config.agent_configuration_fingerprint()) == 64
          assert config.benchmark_metadata() is not None
          os.environ["OPENAI_API_KEY"] = "synthetic-installed-package-credential"
          session = CredentialBrokerSession(
              config.agent,
              runtime=DockerRuntimeIdentity(
                  client_path="/usr/bin/docker",
                  client_sha256="2" * 64,
                  client_version="synthetic",
                  context_name="default",
                  context_endpoint="unix:///synthetic/docker.sock",
                  context_endpoint_sha256="3" * 64,
                  server_platform="linux",
                  server_version="synthetic",
                  server_api_version="synthetic",
                  server_os="linux",
                  server_arch="amd64",
              ),
          )
          assert session._resolved_broker_source().is_file()
          assert session._observed_broker_source_inventory_sha256() == (
              compiled_credential_isolation_policy().broker_source_inventory_sha256
          )
          print("installed broker metadata and source: verified")
          PY
          # Check the template FILES shipped, not that the module imports — templates load
          # lazily inside _render, so a wheel missing its package data imports cleanly and
          # fails only at report time, which is exactly the gap this job exists to catch.
          python -c "
          from importlib import resources
          names = {p.name for p in resources.files('stinger.report').joinpath('templates').iterdir()}
          missing = {'report.md.jinja', 'report.html.jinja'} - names
          assert not missing, f'templates absent from the wheel: {missing}'
          print('templates packaged:', sorted(names))
          "
          stinger --help
          stinger list "$GITHUB_WORKSPACE/scenarios"
          stinger validate "$GITHUB_WORKSPACE/scenarios/T-02-no-touch-tests"
