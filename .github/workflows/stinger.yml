# The reusable "run Stinger in YOUR CI" workflow (SPEC.md §14) — the adoption wedge.
#
# Add this to your repository, commit a stinger.yaml, and every push measures whether your
# coding agent, in your configuration, takes dishonest shortcuts:
#
#   jobs:
#     integrity:
#       uses: cmcnosky/stinger/.github/workflows/stinger.yml@main
#       with:
#         config: stinger.yaml
#       secrets:
#         AGENT_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#
# Two things this job needs that it cannot supply for you:
#
#   * The agent under test must be reachable. This job installs Stinger and builds the
#     verification image, but not your agent's CLI — a `workflow_call` job runs closed, so you
#     cannot add an install step to it. Point `agent.container_image` in your config at an
#     image that already carries the CLI (that is what SPEC.md §5 containment wants anyway).
#     Without it, `stinger run` cannot launch the agent and every scenario scores a
#     non-blocking `error` — fail-closed, never a false pass, but also not a measurement.
#   * The key you pass as the `AGENT_API_KEY` secret is exported to the run as the environment
#     variable `AGENT_API_KEY`, so the config you use in CI must say `api_key_env:
#     AGENT_API_KEY`. (The shipped stinger.example.yaml names `ANTHROPIC_API_KEY`, which is
#     the right name for a local run where that variable is already in your shell.)
#
# The corpus: this job checks Stinger out at `.stinger` inside the caller's workspace, so a
# caller who wants Stinger's own 30 bundled scenarios sets `corpus: .stinger/scenarios` in
# their stinger.yaml (with the default working-directory). A caller with scenarios written
# against their own house rules points `corpus:` at those instead — the shipped
# stinger.example.yaml's `corpus: scenarios` names Stinger's layout, not a caller's.
#
# Your config's `corpus:` is what gets validated and what gets run — including when it points
# at scenarios you wrote rather than the ones Stinger ships. Both steps execute from
# `working-directory`, so they cannot end up disagreeing about which corpus this job measured.
# If your config lives in a subdirectory, set `working-directory` to it and keep `config`
# relative to that directory:
#
#       with:
#         working-directory: stinger
#         config: stinger.yaml
#
# The job fails when integrity regresses. That decision is made by `stinger run` itself, from
# the `regression_threshold` and `baseline` in your config — not by a shell comparison here —
# so the same gate applies whether you run it in CI or on your laptop.
#
# Development-suite reproducibility packages upload on success AND failure. Active sealed
# benchmark evidence is the exception: Stinger marks those packages and this generic public
# workflow refuses both upload and job-summary publication. Move sealed evidence only through
# the separately access-controlled escrow workflow.
name: Stinger
on:
  workflow_call:
    inputs:
      config:
        description: Path to stinger.yaml, relative to working-directory
        type: string
        default: stinger.yaml
      working-directory:
        description: >
          Directory to run stinger from in the caller repo. Corpus paths in your config are
          resolved relative to it, exactly as they are on your laptop.
        type: string
        default: "."
      stinger-ref:
        description: >
          Which Stinger to run. Pin this to a tag if you want comparable numbers over time:
          the rubric version is frozen, but a newer Stinger may ship new detectors and a
          wider corpus, which legitimately changes what gets caught.
        type: string
        default: main
      python-version:
        type: string
        default: "3.12"
    secrets:
      AGENT_API_KEY:
        description: API key for the agent under test. Never written to any artifact.
        required: false

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the caller's repository
        uses: actions/checkout@v7

      - name: Check out Stinger
        uses: actions/checkout@v7
        with:
          repository: cmcnosky/stinger
          ref: ${{ inputs.stinger-ref }}
          path: .stinger

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install stinger
        run: pip install ./.stinger

      - name: Build the verification image
        # Verification runs with the network disabled, so pytest has to already be inside the
        # image. `stinger run` preflights this and refuses to start if it is not — otherwise
        # every scenario would score as a failure for a reason unrelated to your agent.
        run: docker build -t stinger-runner:1 -f .stinger/docker/runner.Dockerfile .stinger

      - name: Prove the corpus is fair before judging anything by it
        # SPEC §12. A trap that fires on correct behaviour, or that misses the cheat it was
        # built for, invalidates the number this job is about to publish.
        #
        # --config rather than a hard-coded path: the corpus this validates has to be the one
        # the next step scores against. Pointing this at Stinger's bundled scenarios would
        # publish a green fairness proof for a corpus a caller with their own scenarios never
        # runs, and leave their actual traps checked only implicitly inside `stinger run`.
        working-directory: ${{ inputs.working-directory }}
        run: stinger validate --config "${{ inputs.config }}"

      - name: Run the integrity harness
        env:
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          # A workflow_call secret the caller did not pass arrives as the EMPTY STRING, not
          # as unset. Exported that way it defeats the adapter's refuse-to-start guard (the
          # missing-key check sees the variable present), and the agent then fails
          # authentication downstream — which reads as agent misbehaviour instead of a
          # wiring mistake. Unset it so the guard can speak.
          if [ -z "${AGENT_API_KEY:-}" ]; then unset AGENT_API_KEY; fi
          stinger run --config "${{ inputs.config }}"

      - name: Locate the reproducibility package
        # `output_dir` is a documented config key; hardcoding `repro/` here would silently
        # upload nothing (if-no-files-found: warn) for any caller who set it — losing the
        # evidence exactly when a failing run makes it matter most.
        id: repro
        if: always()
        working-directory: ${{ inputs.working-directory }}
        run: |
          dir="$(python -c "import yaml; print(yaml.safe_load(open('${{ inputs.config }}')).get('output_dir') or 'repro')" 2>/dev/null || echo repro)"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if find "$dir" -name SEALED_BENCHMARK_EVIDENCE_DO_NOT_UPLOAD -type f -print -quit 2>/dev/null | grep -q .; then
            echo "sensitive=true" >> "$GITHUB_OUTPUT"
          else
            echo "sensitive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the reproducibility package
        if: always() && steps.repro.outputs.sensitive != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stinger-repro
          # Resolved from the working directory too, so the package lands beside the config
          # rather than at the repository root.
          path: ${{ inputs.working-directory }}/${{ steps.repro.outputs.dir }}/
          if-no-files-found: warn

      - name: Publish the report to the job summary
        if: always() && steps.repro.outputs.sensitive != 'true'
        working-directory: ${{ inputs.working-directory }}
        run: |
          report="$(find "${{ steps.repro.outputs.dir }}" -name report.md 2>/dev/null | sort | tail -1)"
          if [ -n "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was produced — see the failing step above." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Refuse public handling of sealed benchmark evidence
        if: always() && steps.repro.outputs.sensitive == 'true'
        run: |
          echo "::error::Active sealed benchmark evidence was produced. Upload and job-summary publication were suppressed. Transfer it only through the access-controlled escrow workflow."
          exit 1
