# The reusable "run Stinger in YOUR CI" workflow (SPEC.md §14) — the adoption wedge.
#
# Add this to your repository, commit a stinger.yaml, and every push measures whether your
# coding agent, in your configuration, takes dishonest shortcuts:
#
#   jobs:
#     integrity:
#       uses: cmcnosky/stinger/.github/workflows/stinger.yml@main
#       with:
#         config: stinger.yaml
#       secrets:
#         AGENT_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
#
# Your config's `corpus:` is what gets validated and what gets run — including when it points
# at scenarios you wrote rather than the ones Stinger ships. Both steps execute from
# `working-directory`, so they cannot end up disagreeing about which corpus this job measured.
# If your config lives in a subdirectory, set `working-directory` to it and keep `config`
# relative to that directory:
#
#       with:
#         working-directory: stinger
#         config: stinger.yaml
#
# The job fails when integrity regresses. That decision is made by `stinger run` itself, from
# the `regression_threshold` and `baseline` in your config — not by a shell comparison here —
# so the same gate applies whether you run it in CI or on your laptop.
#
# The reproducibility package uploads on success AND failure. A failing integrity run is
# exactly when you need the transcripts and the diffs, and a gate that discards its evidence
# on the way out is not auditable (SPEC.md §10).
name: Stinger
on:
  workflow_call:
    inputs:
      config:
        description: Path to stinger.yaml, relative to working-directory
        type: string
        default: stinger.yaml
      working-directory:
        description: >
          Directory to run stinger from in the caller repo. Corpus paths in your config are
          resolved relative to it, exactly as they are on your laptop.
        type: string
        default: "."
      stinger-ref:
        description: >
          Which Stinger to run. Pin this to a tag if you want comparable numbers over time:
          the rubric version is frozen, but a newer Stinger may ship new detectors and a
          wider corpus, which legitimately changes what gets caught.
        type: string
        default: main
      python-version:
        type: string
        default: "3.12"
    secrets:
      AGENT_API_KEY:
        description: API key for the agent under test. Never written to any artifact.
        required: false

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the caller's repository
        uses: actions/checkout@v7

      - name: Check out Stinger
        uses: actions/checkout@v7
        with:
          repository: cmcnosky/stinger
          ref: ${{ inputs.stinger-ref }}
          path: .stinger

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install stinger
        run: pip install ./.stinger

      - name: Build the verification image
        # Verification runs with the network disabled, so pytest has to already be inside the
        # image. `stinger run` preflights this and refuses to start if it is not — otherwise
        # every scenario would score as a failure for a reason unrelated to your agent.
        run: docker build -t stinger-runner:1 -f .stinger/docker/runner.Dockerfile .stinger

      - name: Prove the corpus is fair before judging anything by it
        # SPEC §12. A trap that fires on correct behaviour, or that misses the cheat it was
        # built for, invalidates the number this job is about to publish.
        #
        # --config rather than a hard-coded path: the corpus this validates has to be the one
        # the next step scores against. Pointing this at Stinger's bundled scenarios would
        # publish a green fairness proof for a corpus a caller with their own scenarios never
        # runs, and leave their actual traps checked only implicitly inside `stinger run`.
        working-directory: ${{ inputs.working-directory }}
        run: stinger validate --config "${{ inputs.config }}"

      - name: Run the integrity harness
        env:
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
        working-directory: ${{ inputs.working-directory }}
        run: stinger run --config "${{ inputs.config }}"

      - name: Upload the reproducibility package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stinger-repro
          # `output_dir` is resolved from the working directory too, so the package lands
          # beside the config rather than at the repository root.
          path: ${{ inputs.working-directory }}/repro/
          if-no-files-found: warn

      - name: Publish the report to the job summary
        if: always()
        working-directory: ${{ inputs.working-directory }}
        run: |
          report="$(find repro -name report.md 2>/dev/null | sort | tail -1)"
          if [ -n "$report" ]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was produced — see the failing step above." >> "$GITHUB_STEP_SUMMARY"
          fi
